; ============================================================================
;  Fumes - settings
; ============================================================================
;
;  Every setting here has a built-in default. Delete a line and the default
;  applies; delete the whole file and the mod still runs. Anything that cannot
;  be understood is reported in Fumes.log and then ignored.
;
;  Changes take effect on a script reload (the SHVDN reload key) or a restart.
; ============================================================================


[General]

Enabled = true

; Says hello in the notification feed the first time it ticks.
AnnounceOnLoad = true

; The settings menu: a key, and what has to be held down with it.
; MenuModifier is None | Shift | Control | Alt.
;
; A modifier by default, and not out of caution: a bare letter is one keystroke
; from whatever else you have bound it to, and this game has mods on most of the
; alphabet. Shift+F is free and is not a combination any vanilla control uses.
;
; In the menu: TAB changes page, UP and DOWN move, LEFT and RIGHT change a
; setting, ENTER works a row, BACKSPACE saves and closes. Changes show on screen
; as you make them and are written back here, in place, when you close it.
MenuKey = F

; The menu opens on a controller too: hold LB and press D-pad Down.
;
; A combination for the same reason the keyboard uses Shift+F rather than F. One
; pad button is a press away from something the game already does, and a controller
; has no button spare - every one is spoken for on foot. LB and D-pad Down do
; nothing together in single player, which is the whole test.
;
; Inside the menu the pad needs no setting: D-pad moves, A accepts, B saves and
; closes, LB and RB change page, and in the gauge positioner RB resizes and LT
; steps finely. Those are frontend controls, which the game maps to keyboard AND
; pad, so one reading serves both.
MenuPad = true
MenuModifier = Shift

; Error | Warn | Info | Debug.  Debug is loud but it is what to send with a
; bug report.
LogLevel = Info


[Fuel]

; Multiplies the whole burn model. 1.0 is tuned so an ordinary saloon empties
; its tank in roughly half an hour of real driving.
;   0.5 = half as thirsty (about an hour a tank)
;   2.0 = twice as thirsty
ConsumptionMultiplier = 1.0

; What a motorbike's tank holds, as a CEILING. 0 leaves bikes to handling.meta.
;
; A ceiling rather than a flat value, because handling is right for cars and wrong
; for bikes: fPetrolTankVolume comes back around sixty-five for them, the same as a
; saloon, so filling one cost eighty dollars and the sensible sixteen in the class
; table never got a look in. Sixteen is a sports bike, and it makes a top-up from
; half cost about seventeen dollars.
BikeTankLitres = 16

; How far a bike goes on a full tank, in kilometres. 0 uses the class thirst.
;
; THE POINT IS THE RANGE, so the economy figure is derived from it rather than
; listed: litres per 100 km falls out of the tank size and this number together.
; Sixteen litres over seven hundred and twenty kilometres is 2.2 L/100km, which
; sounds absurd for a motorbike and is exactly the intention - a quarter of the
; fuel covering the same ground as the car parked next to it.
;
; 720 is what a 65-litre saloon does at its own 9.0 L/100km, so bikes match the car
; the range was actually measured against.
;
; Derived rather than a second entry in the thirst table, because the tank and the
; range have to agree: move one and the other follows.
BikeRangeKm = 720

; Litres per hour sitting still with the engine running.
IdleLitresPerHour = 1.4

; Electric vehicles get a tank and buy fuel like everything else.
;
; OFF, and off is the honest default: a Voltic pulling up to a bowser and taking
; sixty litres of unleaded is the one thing in this mod that is simply wrong. The
; alternative was already half built - the gauge says CHARGE instead of FUEL for
; them - but a charge you top up at a petrol pump is a fuel tank with a different
; word on it, and modelling real chargers is a bigger mod than this one.
;
; Off means no tank, no gauge, no prompt at a pump and no fuel burned. On, they
; behave as they used to.
;
; The list of them is in the source rather than here: GTA has no notion of an
; electric drivetrain, so it is a list of model names, and they sit in Sports and
; Sedans next to petrol cars.
AffectElectric = false

AffectBoats = true

; Off by default. Aircraft have nowhere to refuel except a road-side pump, so
; turning this on means landing a Buzzard on a forecourt.
AffectAircraft = false

; Ambient traffic burns fuel too. Off by default: the payoff is cars you will
; never look at stalling out of sight, and the cost is a pass over every
; vehicle near you once a second plus a much bigger save file.
AffectTraffic = false

; Cars YOU have driven, left running, keep burning while they are loaded.
;
; The one you are in - or the last one you got out of - already burns. This is for
; the ones after that: leave a car idling on the forecourt, drive off in another,
; and the first is still running and still drinking. Only cars you have actually
; sat in, so a street of parked traffic is not simulated for nothing. Ignored when
; AffectTraffic is on, which already sweeps everything nearby.
AbandonedIdle = true

; The longest stretch of unwatched idling that gets charged for, in seconds of
; real time, when a car left running comes back into view.
;
; A car that unloads stops burning, because there is nothing left to burn - so
; drive off, come back, and it is exactly as you left it, running, on the fuel it
; had ten minutes ago. Catching up on the gap fixes that; the cap stops it being a
; nasty surprise. Ten minutes of real time is about five in-game hours.
;
; In-session only. Nothing is written down about it, so quitting and coming back
; tomorrow does not present a bill for the night. 0 turns it off.
AbandonedIdleCatchUpSeconds = 600

; How full a vehicle is the FIRST time you ever see it, as a fraction of its
; tank. Anything the game considers yours - a personal vehicle, a mission car -
; ignores these and starts full.
FoundFuelMin = 0.18
FoundFuelMax = 0.85


; A full tank for vehicles the game hands you DURING A MISSION, and only those.
;
; This started as "anything script-owned is full", which made every DLC and online
; car arrive at 100% - script-owned covers everything a trainer spawns. Turning it
; off fixed that and created a worse problem: a story mission that gives you a car
; for a scripted drive would hand it over at a random 18 to 85 per cent, and a
; mission written expecting a full tank can fail through nothing you did.
;
; The mission flag separates them and nothing else does: both kinds are
; persistent, only one appears while a mission is running.
MissionTanksFull = true

; Where the gauge turns amber and the low-fuel warning fires.
ReserveFraction = 0.12

; A shot petrol tank drains onto the road, engine running or not.
TankLeaks = true

; A chime when a tank drops into reserve. Once per dip, not on a loop: a warning
; that repeats is a warning you turn off, and the gauge is already saying it
; continuously in colour - the sound is only there to make you look at it. It
; re-arms when the tank goes back up. No notification with it, on purpose.
LowFuelChime = true

; Which sound, and the set it lives in. Settings rather than fixed, because a
; ONE-SHOT CANNOT BE TESTED from inside the mod: a loop that never started can be
; caught with HAS_SOUND_FINISHED, but a chime that played and a chime that never
; existed both report finished a moment later.
;
; The shipped pair is base game and needs no audio bank. Others worth trying, all
; real names out of the game's own audio metadata - the DLC ones need their bank
; named in LowFuelSoundBank as well:
;   CONFIRM_BEEP          HUD_MINI_GAME_SOUNDSET            (base game)
;   Beep_Red              DLC_HEIST_HACKING_SNAKE_SOUNDS
;   tyre_health_warning   DLC_sum20_Open_Wheel_Racing_Sounds
;   Warning_Tones         DLC_PILOT_ENGINE_FAILURE_SOUNDS
LowFuelSoundName = 5_SEC_WARNING
LowFuelSoundSet = HUD_MINI_GAME_SOUNDSET
LowFuelSoundBank =


[Engine]

; Litres left when the engine starts coughing.
SputterLitres = 0.4

; How much of the tank is spent spluttering, as a SHARE, and the ceiling on it.
;
; A share rather than a fixed number of litres, because a fixed number is a
; different warning on every vehicle: 0.6 L is under one per cent of a saloon and
; nearly four of a motorbike, so the smaller the tank the less notice you got.
; That is backwards - the small tank is the one that empties soonest.
;
; Capped, because a share alone is wrong the other way. A tenth of a saloon is six
; litres, and spluttering through six litres is spluttering for seventy kilometres.
; Whatever the tank, about two litres of warning is the honest amount.
;
; Together: a bike splutters through its last 10%, a saloon through its last 3%,
; and a moped keeps the 0.6 L floor above so it gets any warning at all.
SputterFraction = 0.06
SputterMaxLitres = 1.2

; With this off you simply coast to a stop with an empty gauge and the engine
; keeps running. On is the honest version.
StallWhenEmpty = true



; How long the starter turns over on an empty tank before giving up, each time
; you try it.
DryRestartSeconds = 1.6


[Station]

; How close you have to stand for a pump to offer you its nozzle.
;
; Measured from the pump PROP'S ORIGIN, which sits at the middle of its base -
; so a figure that sounds generous is tighter than it reads, and one that sounds
; right lets you take a nozzle from the far side of the forecourt.
PumpReach = 1.8

; How close the NOZZLE has to be to the vehicle's filler. This is the number
; that decides how precisely you have to walk round to the right side of the
; car. Raise it if you find yourself hunting for the exact spot.
CapReach = 1.9

; How close you have to be to HANG THE NOZZLE BACK UP - deliberately much
; tighter than PumpReach, and it needs to stay that way. You park right next to
; the pump, so the filler is nearly always inside PumpReach too; if this number
; grows to match, the hang-up prompt sits on top of the fill prompt at every
; station and filling up becomes a fight.
HangUpReach = 1.2

; How much nearer the other thing has to be before the prompt changes its mind.
;
; Filling and hanging up want the same button and you stand within reach of both
; at once, so whichever is nearer wins - but at a pump those two distances are
; twenty or thirty centimetres apart, and a bare comparison flips on every step.
; The prompt strobes between them and neither can be pressed. A choice already
; made has to be beaten by this much before it is replaced.
PromptStickiness = 0.5

; Flow rate.
LitresPerSecond = 2.2

; Refuelling from the jerry can you are carrying. Walk up to the filler holding
; the can and it offers to pour.
;
; THE CAN'S AMMO IS ITS FUEL. The game has no notion of a can's contents beyond
; the ammo count on the weapon - which is exactly what it is, and what drains when
; you pour petrol on the floor. So a can half emptied making a trail is half empty
; here too, and there is no second set of books to drift out of step.
JerryCan = true

; How many litres a full can holds.
; Whether the can remembers what is in it rather than trusting the weapon's ammo.
;
; The can's contents are stored by the game as ammunition, and the game resets that
; on its own - after a respawn, an arrest, a mission, a reload. An empty can then
; comes back full, which is free fuel, which is the whole mod undone. With this on
; the level is kept in scripts/Fumes/can.json and only siphoning or a station fills
; it. Turn it off to go back to trusting the game.
RememberCan = true

; Whether reaching for an empty can puts it down instead of doing nothing.
;
; An empty can used to be a dead item: the pour prompt needs fuel in it, and the
; siphon prompt was offered from inside the pour one, so a can drained to nothing
; offered neither - and being filled back up is the one thing an empty can is for.
; With this on the interact key puts it down and the secondary key still siphons
; into it.
DropEmptyCan = true

; How close you have to be to pick a put-down can back up, in metres.
;
; Its own number rather than the filler reach, which is tuned to something the size
; of a car. A jerry can is ankle height and you are standing over it.
CanPickUpReach = 1.8

JerryCanLitres = 20

; How fast it pours. Slower than the pump on purpose: a forecourt sells fuel
; through a hose, a man tipping a can into a wing does not, and that difference is
; most of what keeps the can a last resort rather than a way to skip the drive.
JerryCanLitresPerSecond = 0.8

; Drawing fuel OUT of a tank and into the can, on the secondary button. At a car
; with a part-full can both directions are sensible at once - top the car up, or
; help yourself - so they are two buttons rather than one clever one.
Siphon = true

; An emptied can stays in his hands instead of being taken off him.
;
; The game removes a petrol can the moment its ammo hits zero. That is vanilla
; behaviour and sensible while a can is only a weapon - it is wrong here, because
; an empty can is still the thing you siphon INTO. Losing it at the exact moment it
; becomes useful is backwards.
;
; One unit of ammo is reserved and never spent, so the game always sees a can with
; something in it. That unit is not readable as fuel, so nothing can be poured out
; of an empty can either - it reads as 0.0 L and refuses, it just stays in his hand.
KeepEmptyCan = true

; OFF: the can stands on the floor beside him and his hands are empty.
;
; Holding it is what put his right arm up. The can is a weapon, so the arm carrying
; it goes wherever the pose clip sends it, and this clip sends one arm up - the arm
; the can happened to be in. Putting the can down does not lower that arm as a side
; effect; it lowers it because there is nothing left to hold up.
;
; ON: he keeps hold of it and the game supplies its own carrying animation.
SiphonCanInHand = false

; The hose end sits in his RIGHT hand rather than his left.
;
; With the can in his hand this was decided for him - the hose went in whichever
; hand was not carrying it. With the can on the floor both hands are free and that
; has nothing left to decide, so it becomes a choice: the hose belongs in the hand
; the pose clip actually moves, and this clip moves the right one. That is not a
; guess, it is what had the can up in the air.
;
; The right hand was the guess and it was wrong. The clip does drive the right arm,
; but the hand that arm leaves at the car is the one reaching for the FILLER - and
; the hose runs the other way, down to a can on the floor. So it belongs in the
; other hand, which is the one nearer the can.
SiphonHoseRightHand = false

; How far to the right he turns as the siphon starts, in degrees.
;
; The pose is a fixed clip. It puts his arm where the animator put it, relative to
; HIM, and knows nothing about where the car is - so the hand only lands on the
; filler if he is stood at the right angle to it. The clip reaches across his body
; rather than straight out in front, so that angle is not "facing the cap", it is
; an offset from it.
;
; Negative turns him the other way. Applied once as the siphon begins, not held -
; held, it would fight him every time he moved.
SiphonTurnRight = 80

; The pose he holds while siphoning: the LEFT arm out at the filler, can in the
; right, as if he is feeding the hose into the tank.
;
; An animation rather than IK. IK was the obvious way to put one arm somewhere -
; name the part, name the point - and it is unverifiable: the arm index is a bare
; number the API does not name, and a carrying animation is entitled to override
; arm IK anyway, so a call that does nothing looks exactly like one that worked.
;
; HANDEDNESS IS IN THE CLIP NAME HERE, which is why this dictionary. The first
; attempt used mp_common givetake1_b, reasoning that the _a and _b of a pair are
; the two sides of an exchange and therefore mirrored. They ARE the two sides -
; one hands over, one receives - and both do it with the right hand, because that
; is how people hand things over. Roles, not mirrors.
;
; doors@1handed holds l_hand_sweep and r_hand_sweep: the same push on either arm,
; said out loud in the name. And 1handed is the variant the game plays for someone
; carrying a one-handed weapon - right arm keeps hold of the object, left arm does
; the pushing, which is exactly the shape wanted.
;
; Picked by eye in an animation browser rather than by reading names out of a
; dump, which is how the four before it were picked and why the four before it
; were wrong. A dump gives you a name; it does not tell you where the elbow ends
; up.
;
; It is an UPPER-body clip by construction - the dictionary name says so - which is
; what lets it sit over a crouch and over walking instead of replacing them.
;
; Others, if the reach wants adjusting:
;   mp_player_int_wank_01            the other take in the same dictionary
;   laddersbase base_left_hand_up    a closed grip, higher and straighter
SiphonAnimDict = mp_player_int_upperwank
SiphonAnimClip = mp_player_int_wank_02

; NOT FROZEN. Negative means let it run, and the flag loops it, so the arm keeps
; working for as long as the siphon does instead of holding one frame.
;
; Every pose in this mod up to now has been a still - the pump fill is a handshake
; stopped at 18 per cent, because a handshake that runs is an arm that pumps and
; then drops. A siphon is different: something IS happening the whole time, so a
; still was the wrong idea rather than a badly chosen frame.
SiphonAnimPhase = -1

; Work in bursts rather than steadily - a couple of seconds of motion, a few
; seconds still, over and over.
;
; FROZEN between bursts, not stopped, and that is the whole difference between a
; pause and a restart. Stopping the task drops his arm to his side and starting it
; again lifts it back, so the bursts would read as him giving up and having another
; go. Setting the animation SPEED to zero leaves him exactly where the motion had
; got to, and one carries on from there.
;
; The same freeze the pump pose uses to hold a handshake at 18 per cent, only
; switched on and off on a clock instead of held.
SiphonBurst = true
SiphonBurstOn = 2.0
SiphonBurstOff = 3.0

; 49, not 50. Both are 32 + 16 - player keeps control, upper body only - and the
; last bit is the difference: 1 loops, 2 holds the final frame.
SiphonAnimFlag = 49

; Where on the can the line actually meets it, measured from the middle of the top.
;
; The top of the bounding box is the top of the CAN, which is not the spout: the
; neck sits toward one end, so a line to the centre of the lid enters through the
; can's shoulder. Forward moves it along the can, up lifts it clear of the lid so
; the last inch of hose is not buried in the model.
;
; A jerry can is about 0.30 long, so its own origin sits roughly 0.15 from either
; end - meaning 0.15 here is the front edge, and past that the line leaves the can
; and ends in mid-air. 0.13 is just inside it, on the neck.
SiphonSpoutForward = 0.040
SiphonSpoutUp = -0.070

; The hose runs through his other hand on the way to the can.
;
; One hand holds the end at the car and the other feeds it down, which is how a
; person holds a length of hose. It also gives the run a bend, so it stops reading
; as a straight line from an armpit to the floor.
SiphonHoseBothHands = true

; Across the can. A third axis, because two were not enough to land on a neck.
SiphonSpoutSide = 0.120

; Where the can is stood, relative to him - in front, and a touch to one side.
;
; It used to go beside and slightly behind, from when he stood square to the car
; and the can was just somewhere to set it down. He turns eighty degrees now and
; works across his body, so in front is both where the hose can reach it and where
; he is actually looking.
SiphonCanForward = 0.50
SiphonCanSide = 0.12

; MOVE IT WHILE YOU LOOK AT IT. With a siphon running, the arrow keys slide the
; joint along the can, space and ctrl raise and lower it, and ENTER writes all
; three numbers back into this file. A marker sits on the point so you are aiming
; at something rather than inferring it from where the hose ends.
;
; This exists because six rounds of "a bit further forward" did not settle it. The
; offset is three numbers against a model whose origin nobody can see, and reasoning
; from a bounding box keeps landing near-but-wrong - a bounding box knows where the
; can ENDS, not where its neck is.
;
; ENTER saves AND locks: it writes the three numbers and then sets this to false,
; because "put it there and leave it" is one intention and deserves one button. Set
; it back to true to move the joint again.
;
; The keys are borrowed from controls that already mean something. They are
; disabled for the frame and read anyway, so nothing else acts on them.
SiphonSpoutEdit = false

; How far one press moves it, in metres.
SiphonSpoutStep = 0.01

; He can walk about and crouch while siphoning, instead of being planted.
;
; This costs nothing to allow, which is worth writing down: the pose is flag 50,
; and 50 is 32 + 16 + 2 - allow-player-control, upper-body-only, hold-last-frame.
; The animation has permitted walking the whole time. The only thing standing
; still was the code that disabled the movement controls.
;
; Sprint and jump stay off either way. A man walking with a siphon hose is fine;
; a man sprinting with one has left it behind.
SiphonWalk = true

; He crouches while siphoning.
;
; Stealth movement, because that IS the crouch: the game has no separate on-foot
; crouch for the player. The stealth stance is the crouched one, and it is what
; Ctrl puts you in. It composes with the reach - the pose is upper-body-only, so
; it plays over whatever the legs are doing - and with walking, since a stealth
; walk is still a walk.
;
; Whatever stance he was in before is put back afterwards. A man who was already
; creeping up on a car does not stand up because he finished stealing from it.
SiphonCrouch = true

; The clip he crouches in, played full-body underneath the arm.
;
; An ANIMATION because the stance system will not do it, and that is settled rather
; than assumed. The last attempt pressed the duck control six times, checked
; IsInStealthMode after each and wrote the result down: upright every time. A man
; holding a jerry can is not allowed the stealth stance, and no amount of asking
; changes it. SET_PED_STEALTH_MOVEMENT does not work on the player at all.
;
; Full-body, so it owns the legs while the arm clip owns the arms - that is what
; the upper-body flag is for, and why the two do not fight. The cost is walking: a
; full-body clip means he stays where he is while siphoning.
;
; Others worth a look:
;   amb@medic@standing@kneel@base    base                on one knee, more upright
;   missheistdocks2a@crouch          crouching_idle_a
SiphonCrouchDict = anim@amb@inspect@crouch@male_a@base
SiphonCrouchClip = base

; 1 = loop, full body. Not 49 - the legs are the whole point, so not upper-body.
SiphonCrouchFlag = 1

; A full can does not stop the siphon - the overflow goes on the ground.
;
; The hose has no idea the can is full. It keeps coming, and what does not fit
; lands at his feet, which is both the honest behaviour and a reason to watch the
; meter. Off restores the old stop-when-full.
SiphonOverflow = true

; Draw that spill as a growing pool of petrol.
;
; These are the game's OWN petrol decals - the same ones a jerry can leaves behind,
; which means they IGNITE. That is less a feature this adds than one it declines to
; take away. Stand in it with a lit anything and find out.
SiphonPool = true

; How the pool grows. A decal cannot be resized once it is down, so a growing pool
; is successive decals at one spot, each wider than the last.
;
; The interval and the decal cap are both budget. Sixty a second would spend the
; whole decal allowance inside a second, and that allowance is shared with every
; scuff, skid mark and bullet hole already on the street.
; Roughly four seconds from first drip to a four-metre pool, which is about twenty
; of the sixty decals - so walking off and starting a second puddle still has room.
SiphonPoolWidth = 0.50

; How much wider the pool gets per litre on the floor.
;
; The SIZE IS THE VOLUME, which it was not before. The old version added a fixed
; step every time the timer fired, reached its ceiling in about four seconds, and
; then drew nothing new for the rest of the spill - so nine litres on the ground
; looked exactly like two.
SiphonPoolPerLitre = 0.45

; How much bigger than the last one a new decal has to be before it is worth
; laying. A decal that lands inside its predecessor costs budget and changes
; nothing you can see.
SiphonPoolGrowth = 0.18
SiphonPoolMaxWidth = 8.0
SiphonPoolEverySeconds = 0.20
SiphonPoolMaxDecals = 60

; How far he has to walk for it to become a second puddle rather than the same one.
SiphonPoolStep = 0.5

; How far from the filler he can get before the hose comes out, in metres.
;
; The leash replaces the reach test the other stages use. Standing still, "can he
; touch the cap" is the same question as "is he still doing this". Walking, the
; two come apart, and the second one is the one that ends a siphon.
SiphonLeash = 1.0

; The siphon line: the game's own rope, same as the pump hose.
;
; Painted at pure black did solve the banding - every band computes to the same
; zero, so the cross-width shading contributes nothing. It solved it by making the
; thing genuinely flat, which is the problem underneath: a flat black strip that
; turns to face the camera is a flat black strip, and at arm's length there is
; nothing to hide it. The pump hose is metres away and gets away with it. This one
; does not.
;
; A REAL TUBE now: rings of vertices around the curve with triangles between them.
;
; Why the game's power lines look better than anything a script draws, and what can
; be done about it. Those cables are MAP GEOMETRY - modelled, textured and lit by
; the people who built the world, baked into the props. No script can add map
; geometry. A script has exactly three options:
;
;   ADD_ROPE     a real physics rope. Flexible, but its thickness is fixed per type
;                in ropedata.xml and NO native changes it. All eight types are tow
;                ropes and winch cables. That is the tiny rope.
;   billboards   a strip turned to face the camera. Flat, and the eye knows it.
;                That is the flat planes.
;   DRAW_POLY    raw triangles in world space. Full control of the shape.
;
; The first two are what had been tried. Tube is the third, and the only one that
; can be round, because it is the only one where the roundness is geometry rather
; than a picture of geometry. It is not lit or textured the way the power lines are
; - DRAW_POLY is flat-shaded - so each face is tinted by how square-on it sits to
; the camera, which is what lighting would have done anyway on a matt black cable.
;
; Tube | Auto | Painted | Line | None
; LINE, not Tube. The tube is real geometry and it drops faces: the ring it builds
; is squared against the direction from one point to the next, and a short hose has
; short segments - under the length threshold the frame falls back to a fixed
; up-vector, which spins the ring, turns faces away from the camera, and back-face
; culling then throws them out. That is the flicker. It gets worse on the siphon
; because the through-both-hands run splits an already short hose into two legs.
;
; The ribbon has no such problem: it is one strip that always turns to face you.
; Flat, and at three centimetres nobody can tell.
SiphonHose = Line

; Only read when SiphonHose is Painted - a rope carries its own colour.
; 0,0,0 with no sheen. Raise any of these and the round-tube shading comes back.
SiphonHoseRed = 0
SiphonHoseGreen = 0
SiphonHoseBlue = 0
SiphonHoseSheen = 0

; Thickness is read by Painted and by Tube; the rope draws itself and ignores it.
; Sag applies whatever the mode, and is tighter than the pump hose because this
; span is under a metre.
SiphonHoseThickness = 0.030

; How many faces round the tube. Six or seven is round enough at arm's length;
; more is polygons spent on a curve nobody is measuring. Back faces are skipped, so
; the real cost is about half of sides x segments x 2 triangles per frame.
SiphonHoseSides = 7
SiphonHoseSag = 1.05

; The darkest of the eight rope types - the same one the pump hose settled on.
; Not 5 any more: 5 was the THINNEST, picked to hide under a drawn ribbon. With
; the ribbon gone the rope is what you see, so it wants to be the one that looks
; right rather than the one that disappears.
SiphonHoseRopeType = 4

; How many faces round the pump hose, if you set Hose = Tube. See SiphonHoseSides.
HoseSides = 7

; He can throw a punch or a kick without stopping what he is doing with the can -
; siphoning or pouring. Not at the pump: the same button on a running nozzle is a
; different problem.
;
; The attack button stays DISABLED the whole time, which is what makes it safe.
; It is disabled because the thing in his hand is a petrol can with live ammo, and
; the trigger on a petrol can lays a trail of fuel across the forecourt. The game
; still reports the press of a disabled control, so the press is seen, the can
; never fires, and the press is free to mean something else.
KickWhileFilling = true

; How long the pose stays out of the way once he swings.
;
; A window rather than a check for "is he still swinging", because the melee state
; is not readable on the frame the button goes down - and a pose reapplied on that
; frame cancels the swing before it starts.
KickSeconds = 1.5

; Slower than pouring, which is slower than the pump. A hose and a mouthful of
; petrol is the least efficient way to move fuel there is.
SiphonLitresPerSecond = 0.5

; Base price. Each station in stations.json multiplies this by its own figure.
PricePerLitre = 1.55

; Which grade you buy: Regular | Plus | Premium. The pumps have had these written
; down their sides since the game shipped and it has never meant anything.
;
; A setting rather than a prompt at the pump, because it is a habit rather than a
; decision you make afresh at every forecourt - and because the only button left
; to ask on is the one that took two attempts to stop strobing.
;
; THE GRADE IS REMEMBERED PER TANK, not read at burn time. The economy follows the
; fuel that is actually in the car, so one you filled with premium last week is
; still running on premium whatever this says today. Reading the setting when fuel
; is burned would let you change the mileage of every car you own by flipping a
; menu row, which is a cheat rather than a feature. Last fill wins.
; Pick the grade at the pump, on a card, instead of only in this file and the menu.
;
; A panel rather than a prompt, because the choice has numbers attached - what each
; grade costs HERE and what it returns. Cycling a word on a help-text line would
; fit on screen and would ask you to remember those numbers while pressing a button
; to find them. The price is the forecourt's, so it differs at every station.
;
; Never shown for a diesel vehicle: there is nothing to decide, and a card offering
; three petrols to a truck is a button press to be told no.
;
; Arrows or the D-pad choose, Enter or A fills, Backspace or B backs out with the
; nozzle still in hand. Whatever you pick becomes the new default.
GradeMenu = true

Grade = Regular

; DIESEL. Diesel vehicles take diesel, and the pump display says so while it goes
; in. Off, trucks fill up with premium unleaded like everyone else.
;
; The game does not know which vehicles are diesel - there is no flag on a
; vehicle, nothing in handling.meta a script can reach, and no native that
; answers it. The closest thing the game has to an opinion is the class it files
; a vehicle under, and that is a showroom category rather than a statement about
; the engine. So this is a judgement, made from the class and corrected by name.
DieselVehicles = true

; Classes that are diesel wholesale.
;
; Emergency is deliberately NOT here: the Fire Truck and Ambulance are diesel and
; the eight police cars beside them are not, so the two are named below instead
; of the eight. Service IS here, because the only petrol vehicle filed there is
; the Taxi. Utility likewise, minus the battery carts and the mower.
;
; Valid names: Compacts, Sedans, SUVs, Coupes, Muscle, SportsClassics, Sports,
; Super, Motorcycles, OffRoad, Industrial, Utility, Vans, Cycles, Boats,
; Helicopters, Planes, Service, Emergency, Military, Commercial, Trains,
; OpenWheel.
DieselClasses = Commercial, Industrial, Utility, Service, Military

; The models that break the rule, in both directions. Petrol wins over diesel,
; and both win over the class, so an exception always beats the rule it excepts.
;
; These are MODEL names - phantom, firetruk - not the showroom names the game
; shows you. They are matched by hash, because a script cannot read a model name
; back out of the game.
DieselModels = firetruk, ambulance
PetrolModels = taxi, caddy, caddy2, caddy3, airtug, mower

; What diesel costs and what it returns. Dearer at the pump and further down the
; road, which is the shape of it at an Australian servo - and the same trade
; Premium makes, only harder.
DieselPrice = 1.06
DieselEconomy = 0.82

; What Plus and Premium cost, as a multiple of the regular price.
PlusPrice = 1.12
PremiumPrice = 1.25

; What they do for consumption. Under 1 goes further. Small on purpose: premium is
; a tenth better and a quarter dearer, so it is a bad deal in money and a good one
; in range, which is the honest shape of the real trade.
PlusEconomy = 0.96
PremiumEconomy = 0.90

; How far a station's price may wander from its own figure, either way.
; 0 turns the wobble off and prices become exact.
PriceVariance = 0.18

ShowBlips = true

; What every station blip is called on the map. Blank gives each its own title.
;
; THE LEGEND GROUPS BY NAME - that is the whole mechanism. Blips sharing a name
; collapse to one row you can step along; blips with their own names are a row
; each, so the forecourts were twenty-six separate entries in a list of a hundred
; and forty-seven.
;
; The cost is that the row can no longer say which brand or which district, which
; is exactly what having its own name bought. Blank this to take that back.
BlipName = Fuel Station

; Whether the mod corrects its own station coordinates from the pumps it finds.
;
; The shipped list was written down by hand and some of it is simply wrong - a
; blip on the far side of a block from the forecourt it names. Nothing depends
; on those numbers (pumps are found as objects, not by coordinate) so a bad one
; only ever misplaced a marker - but a marker is what you navigate by.
;
; With this on, driving within sight of any pump moves the nearest listed
; station onto it. Corrections go to scripts\Fumes\stations.local.json and
; never touch the shipped file; delete that file to go back to the defaults.
;
; A station that is badly wrong - too far out to move safely - is NAMED IN THE
; LOG instead of being guessed at. Check Fumes.log if a blip still looks off.
LearnStations = true

; Traffic that is low on fuel and ALREADY NEAR a station pulls in, sits at the
; pumps for a few seconds, and drives off again.
;
; Deliberately not "low car goes looking for a station". Stations are a median six
; hundred metres apart, the mod simulates a hundred and twenty, and the game
; despawns traffic well before that - so a car sent half a kilometre for fuel
; vanishes on the way, every time. Keeping it alive would mean marking it a
; mission entity, and those are never reclaimed, so every low NPC would sit in the
; vehicle pool for the rest of the session.
;
; Inverted, all of it happens inside the radius: nothing is persisted, nothing
; leaks, and it lands where you actually are - at a forecourt, watching other cars
; use it. Works with AffectTraffic either way, because tanks are generated
; part-full whether or not traffic burns fuel.
TrafficRefuels = true

; How empty before a car bothers, how near a station it must already be, how long
; it sits there, and how long before it gives up trying to get in.
TrafficRefuelBelow = 0.22
TrafficRefuelRadius = 160
TrafficRefuelSeconds = 9
TrafficRefuelGiveUpSeconds = 45

; Most cars doing this at once. Two is ambience; ten is a traffic jam.
TrafficRefuelMax = 2

; GTA's standard "obeys lights and traffic" driving flags. A bitfield, not a
; number that means anything on its own.
TrafficDrivingStyle = 786603

; Off means fuel is free. Everything else still works.
ChargeMoney = true


[Nozzle]

; Take the nozzle, start and stop filling, hang it up. A controller's context
; button works as well, always, whatever this says - and the on-screen prompt
; shows the real button for whatever you are holding.
; Accepts a key name (E, F, Y, NumPad0) or a hex code (0x45).
InteractKey = E

; What his hands do while the nozzle is out.
;
; FireExtinguisher = the default. The game already knows how a man carries one,
;                    so the walk, the grip and the idle all come free. It is
;                    also a weapon that SPRAYS, which is the only route to fuel
;                    ever coming out of the nozzle under your control later.
; PetrolCan        = an invisible jerry can instead. One-handed, no trigger.
; None             = prop in hand, arm hanging. Use it if the pose fights
;                    another mod.
Pose = FireExtinguisher

; How the hose is drawn.
;
; Painted = the default, and the only one that gives a BLACK hose. A real
;           physics rope does the shape, the swing and the sag; the colour is
;           drawn on by us along the rope's own vertices. GTA cannot tint a
;           rope - the colour is baked into the texture - so this is the way.
; Auto    = a real rope wearing its own (beige) texture, falling back to Line.
; Rope    = insist on the rope and its texture, no fallback.
; Line    = no rope at all, just a drawn hanging curve. Cannot fail.
; None    = no hose drawn.
;
; TUBE is the one to use: rings of vertices around the curve with triangles
; between them, drawn with DRAW_POLY. It replaces the physics rope, and that is the
; trade worth knowing. A rope is a real object - it drapes over what is in the way
; and swings when the car moves. A tube is a computed curve: cleaner, rounder,
; always the right thickness, and it hangs through anything it crosses. Between a
; bowser and a filler cap there is nothing in the way, so the trade is cheap here.
Hose = Line

; The hose colour, for Painted mode. Near-black rubber by default.
; Flat black, matching the siphon line. On the old flat strip these fed a fake
; highlight painted down the middle to imply a tube; on real geometry the shading
; is real - faces along the silhouette go dark, faces pointing at you light up - so
; raising these now gives an honest highlight rather than a drawn-on one. They are
; at zero because black on a round silhouette is what looked right.
HoseRed = 0
HoseGreen = 0
HoseBlue = 0

; The highlight down the middle of the hose, ADDED on top of the colour above.
; This, not the colour, is what stops a black hose being black - the shading that
; makes a flat ribbon read as a round tube works by adding light along its centre,
; and it used to be a hardcoded 58, so a hose set to 20,20,23 still drew at nearly
; 70 up the middle. 0 is a flat silhouette: properly black, and it stops looking
; like an object. Raise it if the hose disappears against dark tarmac at night.
HoseSheen = 0

; How thick the hose is, in metres across. It is drawn as solid geometry, so
; this is a real width and not a number of hairlines - raise it and the hose
; genuinely gets fatter at every distance.
; A real forecourt hose is nearer 0.03; this is deliberately fatter, because it
; is being read at four to eight metres against dark tarmac at night.
; Thicker than the siphon line at 0.030 so that it LOOKS the same. The siphon
; hangs under a metre from the eye; this spans two or three metres across a
; forecourt, and the same real diameter at three times the distance reads thinner.
HoseThickness = 0.040

; How far the nozzle reaches from its pump.
HoseMaxMetres = 9.0

; Where the warning starts, as a fraction of the maximum.
HoseWarnFraction = 0.8

; GTA's own rope types, 0-8, and none of them can be tinted. 5 is the thin dark
; metal wire, which is what Painted mode wants underneath its drawn hose.
; 1 is the tan mooring rope you see in Rope and Auto modes.
HoseRopeType = 4

; The in-game rope picker. With the nozzle in your hand, NumPad * steps through
; the eight ropes and NumPad 0 writes the one you are looking at into this file.
; Eight is the whole of it: ADD_ROPE's type indexes ropedata.xml, that file has
; eight entries, and ADD_ROPE is the only general rope creator the game exposes -
; every other rope native belongs to a cargobob or a tow truck.
; Set this false once you have settled on one, to give the key back.
RopePicker = true

; Rope types that crash this install. ADD_ROPE indexes a table rather than
; validating its argument, so a type past the end ends the process outright -
; which 8 did. Fumes adds to this list by surviving the crash and noticing on the
; next launch, not by predicting it.
BadRopeTypes = 8

; The rope textures have no names, no previews and no documentation - the only
; description of type 5 anywhere is that SHVDN calls it "thin metal wire". 4 is
; the one this ships with; 0-7 are all safe, and 8 is not (see BadRopeTypes).

; Slack, as a multiple of the straight-line distance. 1.0 is a taut wire.
HoseSag = 1.22

; true  = walk too far and the nozzle is torn out of your hands.
; false = you simply cannot walk any further.
HoseSnaps = true

; Where the hose is bolted to the pump, in the pump's own space, in metres.
; X is across, Y is forward, Z is up. X is mirrored automatically to whichever
; side you are standing on. Z wants to be near the TOP of the machine, where a
; real nozzle hangs - not out of the middle.
; The game has six different pump models and they are not the same shape, so
; nudge these if the hose leaves from the wrong place on the one near you.
HoseAnchorX = 0.30
HoseAnchorY = 0.08

; Take the hose height from the PUMP'S OWN HEIGHT rather than this number. The
; game has six pump models and they are not the same size, so any single figure
; is wrong for most of them - which is how HoseAnchorZ ended up being raised
; four times and still being too low. The model's bounding box knows exactly how
; tall it is; 0.92 of that is the holster on the lid, where a real hose hangs.
HoseAnchorAuto = true
HoseAnchorHeight = 0.92

; Only used with HoseAnchorAuto = false.
HoseAnchorZ = 2.10

; Where the nozzle sits in his hand, and which way round it points.
; Offsets are metres, rotations are degrees. prop_cs_fuel_nozle is a scene prop
; whose origin is not its grip, so it needs these - at zero it hangs out of the
; fist like a dropped knife.
NozzleOffsetX = 0.055
NozzleOffsetY = 0.02
NozzleOffsetZ = 0.0
NozzleRotX = 0
NozzleRotY = 270
NozzleRotZ = -90

; If it comes out SIDEWAYS rather than the right way up, the flip wanted a
; different axis: put NozzleRotY back to 90 and set NozzleRotX = 180 instead.
; If it is right way up but facing backwards, NozzleRotZ = 180.

; Which hand the nozzle goes in. LEFT, because the filling animation says so:
; every clip reaches with one particular arm and the handshake reaches with the
; left, so a nozzle in the right hand leaves him extending an EMPTY hand at the
; car. Change the fill clip to one that reaches right and change this back -
; they are two halves of one decision.
LeftHand = false

; Where the hose meets the NOZZLE, in the nozzle's own space. It used to end at
; the hand bone, which is a hand's width from where a hose really joins - so it
; ran into his fist and out the far side. Hung off the prop it also rotates with
; the nozzle, so tilting the nozzle swings the hose with it.
; Negative Y is behind it.
; Work the hose attachment out from the NOZZLE'S OWN SHAPE. Its bounding box has
; a longest axis, and on a fuel nozzle that axis IS the nozzle - spout at one
; end, hose at the other. The only thing a box cannot tell you is which end is
; which, so that is one setting instead of three: flip HoseEndSign.
HoseEndAuto = true
HoseEndSign = -1
HoseEndReach = 1.20

; A fine nudge on top of the automatic point, in the nozzle's own space.
HoseEndX = 0.000
HoseEndY = 0.000
HoseEndZ = 0.035

; How far STRAIGHT UP IN THE WORLD the hose joins the nozzle, in metres.
; The three above are offsets in the nozzle's OWN space, and the nozzle is
; attached turned through a right angle twice - so none of its axes points
; anywhere near up, which is why "move the hose end up a bit" kept missing.
; This one is applied after the offset becomes a world position.
HoseEndLift = 0.120

; How far to HIS RIGHT the hose joins, in metres; negative is his left.
; Along the ped's own right vector, not a world axis - a world axis means "east",
; which stops being sideways the moment he turns round.
HoseEndSide = -0.010

; A marker on the vehicle's fuel filler while you are carrying the nozzle.
; Off: the help text names the car and the filler is where you would expect.
ShowFillerMarker = false

; The clip he HOLDS while fuel is going in - one arm out to the car.
;
; Nothing in the game is animated for refuelling, so the job is to find a clip
; whose shape is right and stop it there. A handshake reaches forward at waist
; height with the hand closed, which is exactly where a nozzle goes.
; (A hold-up pose was tried first and aims a pistol - right idea, arm too high.)
; Leave either blank and he just stands there holding it.
FillAnimDict = mp_common
; givetake1_b, the RIGHT-arm side of the pair, to match the hand the nozzle is
; attached to. LeftHand already put the prop in his right hand, but that setting
; only moves the prop and the hose end - it never touched the animation, so the
; left arm was doing the reaching while the nozzle sat in the hand at his side.
;
; _a and _b ARE mirrored, which corrects something written here earlier. When the
; siphon pose was being chosen, _b was tried, it lifted the right arm, and the
; conclusion drawn was that the two are the giver and receiver of one exchange -
; roles rather than mirrors, both right-handed. That was wrong, and this is the
; evidence: _a has been on the pump all along and it lifts the LEFT.
FillAnimClip = givetake1_b

; Where in the clip to freeze, 0 = first frame, 1 = last. THE POINT of it: a
; handshake is a movement - reach, grip, shake, withdraw - so letting it play
; gives an arm that pumps and then drops back to his side. Frozen at the reach
; it is a pose. Set it negative to let the clip play through normally.
;
; TASK_PLAY_ANIM CANNOT ANIMATE ONE ARM. The upper-body flag takes the whole
; upper body, so a clip that also raises the free arm will raise it whatever you
; do, and there is no setting here that can stop it. The only fix is a different
; clip - so FillAnimClip is the setting that matters, not this one. A dict this
; game does not have is reported in Fumes.log rather than silently doing nothing.
FillAnimPhase = 0.18

; The animation for tipping a jerry can into a tank. Blank uses the built-in list.
;
; This is the game's OWN pouring clip, played directly - rather than handing him
; the can and making him fire it, which is how the animation normally happens and
; which also lays a petrol trail across the forecourt, drains the ammo on the
; game's schedule instead of ours, and leaves a lit fuse next to a pump.
;
; Blank because clip names inside a dictionary cannot be listed from a script:
; the game will say whether a DICTIONARY exists and nothing will say what is in
; it. Fumes tries a handful and checks each one is really playing, then names the
; winner in Fumes.log - copy it here to skip the search.
; weapons@misc@jerrycan@ holds the ACTIONS - discard, fire, fire_intro,
; fire_outro, unholster. weapons@misc@jerrycan@mp_male holds idle, run, sprint and
; walk, which are how you CARRY one. Two dictionaries a character apart, and only
; one of them pours.
PourAnimDict = weapons@misc@jerrycan@
PourAnimClip = fire

; The anim flag. 48-63 is the game's own "upper body, controllable" band, which
; blends the clip over his legs and leaves you in charge instead of planting him
; in a cutscene. 50 is that band plus hold-last-frame and NOT loop - looping a
; handshake shakes forever.
FillAnimFlag = 50

; The sound of fuel going in, while it is going in.
;
; The two names below are BLANK ON PURPOSE. PLAY_SOUND_FROM_ENTITY looks a sound
; up by string in the game's audio metadata; a name that does not exist plays
; silently and reports nothing, and there is no native that lists the valid ones.
; Left blank, Fumes tries a list of candidates and uses HAS_SOUND_FINISHED to
; work out which one actually started - a loop that is really playing does not
; report finished half a second in. Whichever wins is named in Fumes.log; copy it
; here and the search is skipped on every later run.
;
; Filled in by hand these are taken on trust and never tested, on the grounds
; that anyone typing a name in here knows something the mod does not.
FillSound = true
FillSoundName =
FillSoundSet =
FillSoundBank =


[HUD]

; Where the forecourt prompts appear.
;
; HelpText  = the game's help box, TOP LEFT. The default. Shows the real button
;             glyph for whatever you are holding, keyboard or pad.
; ButtonBar = the instructional button strip, bottom right. Prettier, but its
;             position is baked into Rockstar's scaleform and cannot be moved.
Prompts = HelpText

ShowGauge = true

; Only draw the gauge when you are in the vehicle (it is always drawn while
; you are actually filling one).
OnlyInVehicle = true

; The gauge goes when the game's own HUD or radar does. A fuel bar floating beside
; a minimap that is not there is worse than no fuel bar - so anything that hides
; the radar takes this with it and needs to know nothing about Fumes to do it.
FollowsHud = true
; The gauge takes its size and its foot from Bare Minimum's row of bars when that mod
; is running. THE FUEL GAUGE IS THE SIXTH BAR IN A ROW OF FIVE, and the only thing
; that makes the six read as one instrument is that every number matches -- they used
; to be matched by copying Width, Height and Y in here by hand, and that held until
; that mod's minimap frame started deciding where its row ends. Asked for now, from
; the mod that owns the answer. X below is never taken: the row stands on the far side
; of the minimap and this stands on the near side. Off, or without that mod, Width,
; Height and Y below are used as they always were.
MatchBars = true

; Upright, down the LEFT SIDE of the minimap, rather than a strip beneath it.
;
; A fuel level is a height in a container, and the pump display already draws it
; as one - so the two readings of the same number now look like the same
; instrument. Set this false for the old horizontal strip under the map.
Vertical = true

; Position and size, as a fraction of the screen. X and Y are the gauge's
; TOP LEFT corner; upright, that is the top of the bar and it fills upward from
; the bottom.
;
; Where the minimap actually lands depends on your safe-zone slider and your
; aspect ratio, and there is no honest way for THIS mod to ask - so if it sits
; even slightly off on your screen, these four are the ones to move. The gauge
; logs its real size in pixels to Fumes.log the first time it draws, which beats
; guessing from a fraction.
;
; X IS IGNORED WHEN BARE MINIMUM IS RUNNING, unless ManualX below is true. That
; mod CAN ask - it has to, for its own minimap frame - and it publishes where the
; far side of the map is, so the gauge stands opposite its row of bars and moves
; with it if the row changes sides. Y, Width and Height already came from it; see
; MatchBars.
X = 0.1330

; Use X above even when Bare Minimum is there to say where the gauge goes. Turn
; this on to put the gauge somewhere else on the screen entirely. With that mod
; not installed there is nobody to ask and X is used whatever this says.
ManualX = false
Y = 0.8100
Width = 0.0048
Height = 0.206
; Litres | Gallons.  Gallons converts the prices too.
Units = Litres

; The percentage inside the upright gauge. Off - the pump and the level of the
; bar say enough, and a two digit number sixteen pixels wide was never going to be
; read at a glance anyway. This does NOT hide the pump; see ShowGaugeIcon.
ShowNumbers = false

; The amber tick at the reserve level. Off: the bar is a continuous colour ramp
; now, and it is already red by the time that tick matters - it was marking a
; threshold the colour had announced long before, and on a narrow bar it read as
; damage rather than as a mark.
ShowReserveMark = false

; The turned FUEL label inside the upright gauge. Off: the bar has the reading
; inside it now, and a gauge with a number in it does not need labelling.
; How solid the whole gauge is, 1 being exactly as drawn and 0 invisible. One
; number for every colour it draws, so the alphas in the code stay as the ratios
; between the parts and this moves the lot without disturbing any of them.
; 0.85 sits it about where the game's own health and armour bars are.
Opacity = 0.72

ShowGaugeLabel = false

; The little pump above the reading, inside the bar. It replaces the turned FUEL
; label and does the job better - it says what the bar is without spending a
; third of the bar's length spelling it.
ShowGaugeIcon = true

; Draw the fuel as liquid rather than as a plain filled rectangle: bubbles rising
; through it and a brighter line riding the surface, so the top is a surface and
; not just where the colour stops. The surface itself is flat - the pump display's
; waves need more width than a sixteen pixel bar has. Off gives a plain bar.
GaugeLiquid = true
; BARE MINIMUM'S FIVE, at Bare Minimum's defaults, because the fuel bar now moves
; exactly the way its five bars do and these are the same knobs by the same names.
;
; Wave   how far the surface travels, 0 to 1.
; Slosh  how hard a fill or a drain kicks it, 0 to 1.
; Lean   how much braking throws it up one wall of the tank, 0 to 1.
; Drift  how visible the three rising bubbles are, 0 to 1. 0 removes them.
; Pace   the clock everything above runs on. 42 is Bare Minimum's.
Wave = 1
Slosh = 1
Lean = 1
Drift = 1
Pace = 42
; The bevel and the sweeping highlight on the fill, 0 to 1. 0 is flat.
;
; A lit edge down the left of the fill and a shadowed one down the right, so it
; stands off the channel instead of lying flat in it, with a soft slanted band
; crossing every six seconds or so. It was the armour bar's alone; every bar in
; the row wears it now, and the fuel gauge wears the same one at the same numbers.
Relief = 1


; How much faster the fuel moves at speed, and the speed it gets there at.
;
; Fuel in a tank does what the tank does: still at rest, thrown about at speed. It
; is flat above MotionSpeed, because past a point more speed does not make a
; liquid slosh faster, it makes it slosh harder - and an animation that keeps
; accelerating with the speedometer stops reading as fuel and starts reading as a
; loading spinner. MotionMax = 1 turns it off.
; NOTHING HAPPENS BELOW MotionFromKmh. The fuel moves at its normal rate through
; town and only starts winding up once you are going somewhere - held flat until
; it is worth remarking on, the speed-up becomes an event rather than a thing that
; is different at every speed. Full effect by MotionFullKmh.
;
; In km/h, not the metres a second used elsewhere in this file, because these are
; the two you set while thinking about a speedometer.
;
; MotionMax = 1 turns it off entirely.
MotionMax = 3.0
MotionFromKmh = 80
MotionFullKmh = 150

; How fast the fuel moves at a DEAD STOP, and the speed by which it is back to
; normal. A little slower, not slow motion - fuel in a parked car is settling
; rather than being thrown about, and that is worth a glance, but an earlier go at
; this ran the idle at a quarter speed and the bar read as broken rather than
; calm. Eased out over the first few km/h so a car rolling at walking pace is not
; treated as parked. MotionIdle = 1 turns it off.
MotionIdle = 0.70
MotionRestKmh = 12

MotionRiseSeconds = 0.8
MotionFallSeconds = 4.0

; How wide the pump is drawn, as a fraction of the bar's width. 0.66 puts it on
; exactly the pixels it was on before the icon was cropped: the old square file
; spent 170 of its 256 pixels on ink, and was drawn at the full bar width.
IconScale = 0.85
; Hide the reading at a full tank. A full bar already says full, and 100 is the
; one reading that does not fit: the digits are sized so two of them span the bar,
; so a third only gets in by shrinking all three.
HideFullReading = true

; How big the lettering in the upright gauge is, as a multiple of the bar's
; width. Its own number, because "thinner bar" and "smaller text" turned out to
; be two different requests and tying them together meant neither could be
; answered without moving the other.
TextScale = 1.35


[Hazard]

; Fire at the pumps while you are stood there with the hose out ends the way
; you would expect. Never fires out of nowhere: you have to be on fire, there
; has to be a fire at the pump, or somebody has to be shooting on the forecourt.
ForecourtHazard = true


